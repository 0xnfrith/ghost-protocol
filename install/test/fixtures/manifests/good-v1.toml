# A valid schema v1 manifest for the test instance example/instance: its home
# is ~/work/instance.
schema = "ghost-protocol/instance/v1"
name = "instance"
root = "~/work"

[github]
login = "example-bot"
host_config = "~/.gitconfig-host"
repos = ["example/tools"]

[claude]
email = "agent@example.com"

[setup]
command = "setup.sh --profile {profile} --no-auth"
