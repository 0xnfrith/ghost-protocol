# A valid manifest for the test instance example/instance.
schema = "ghost-protocol/instance/v0"
name = "instance"
dir = "~/instance"

[github]
login = "example-bot"
host_config = "~/.Config/Git/config"
repos = ["example/tools"]

[claude]
email = "agent@example.com"

[setup]
command = "setup.sh --profile {profile} --no-auth"
