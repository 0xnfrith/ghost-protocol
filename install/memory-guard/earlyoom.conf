# ghost-protocol.conf: the GHOST Protocol memory guard, a drop-in for the
# earlyoom package's service. The installer (step 14, install/lib/service.sh)
# fills in the two percentages of -m below from the instance manifest
# ([memory_guard], default 15 and 8) and puts the result at
# /etc/systemd/system/earlyoom.service.d/ghost-protocol.conf.
#
# Why: an instance runs Claude Code with many subagents, and their test suites
# and builds, on a small Linux machine, often with no swap. When program memory
# fills RAM, Linux frees the cached code of running programs instead, so every
# new process has to read its program back from disk. The machine stops
# answering: logins may work, but no new command finishes. The kernel's own
# out-of-memory killer may never fire, because freeing that cache counts as
# progress. earlyoom watches available memory instead and kills one process
# well before that point.
#
# What it does:
#   -m T,K      SIGTERM to one process when available memory falls to T % of
#               RAM, SIGKILL when it falls to K %. "Available" counts cached
#               program code as free, and the machine starts to thrash once
#               that code itself is evicted; earlyoom's own default (10 %)
#               leaves too thin a margin on a small machine. From earlyoom 1.8
#               the percentages are of the memory user programs can use
#               (MemAvailable + AnonPages), slightly less than all of RAM.
#   -s 100,100  act on memory alone. earlyoom acts only when swap is low too;
#               100 for both signals means "always", with or without swap.
#               (With -s 100 alone, SIGKILL would wait for swap at 50 %.)
#   -r 600      one memory line in the journal every 10 minutes, so an
#               incident has a timeline (journalctl -u earlyoom).
#   --avoid     these names score 300 lower, so earlyoom picks them last:
#               Claude Code itself, the instance's watchdog (install/service/
#               start, whose process name is start), tmux, systemd, sshd, dbus,
#               cron, and every zsh process (zsh is often the login shell).
#               This is not an exemption (earlyoom 1.7 has none apart from
#               oom_score_adj -1000, which every child of claude would
#               inherit): claude is still killed when it alone holds most of
#               the memory. Whether it then comes back depends on what runs
#               it: a supervisor such as the instance's systemd unit
#               (install/service/) starts it again, but the installer does not
#               set that unit up yet.
#   --prefer    these names score 300 higher: build, compile and OCR tools
#               whose process name is their own and that are safe to lose
#               (esbuild, cargo, rustc, go, pytest, tesseract, ImageMagick).
#   Everything else is ranked by size alone. That includes node, bun, npm
#   (an npx MCP server shows as "npm exec ..."), python and java: MCP servers
#   and channels run as those, and earlyoom matches only the process name, so
#   it cannot tell one from a test run. Test runners such as vitest, jest and
#   tsc run as node too, so their names never match. bash and sh are in
#   neither list (test suites are often bash scripts), nor is git (a killed
#   git can leave a stale .git/index.lock behind).
#   -g (kill the whole process group) is off: claude's MCP servers share
#   claude's process group.
#
# The patterns are POSIX extended regexes matched against the process name
# (/proc/PID/comm, at most 15 characters). "$$" is systemd's way to write one
# "$"; "[(]" and "[)]" match the literal parentheses of "(sd-pam)". The line
# holds no quote, backslash, ";" or "%", so systemd passes it on as it reads,
# "$$" apart.
# This ExecStart replaces the package's own, so EARLYOOM_ARGS in
# /etc/default/earlyoom is no longer read. A drop-in in the same folder whose
# name sorts after this one, and that sets ExecStart too, wins over it; the
# installer then reports the guard as not set up.
#
# Undo: sudo rm /etc/systemd/system/earlyoom.service.d/ghost-protocol.conf,
# then sudo systemctl daemon-reload and sudo systemctl restart earlyoom (back
# to the package's defaults), or sudo apt-get remove earlyoom. The installer
# puts it back on its next run unless the manifest says, under
# [memory_guard], enabled = "false".

[Service]
ExecStart=
ExecStart=/usr/bin/earlyoom -r 600 -m @TERM_PERCENT@,@KILL_PERCENT@ -s 100,100 --avoid ^(claude|start|tmux.*|systemd.*|[(]sd-pam[)]|init|sshd.*|dbus-.*|cron|zsh)$$ --prefer ^(esbuild|cargo|rustc|go|pytest|tesseract|convert|magick)$$
# earlyoom must outlive the processes it is there to kill.
OOMScoreAdjust=-1000
Nice=-20
